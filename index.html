<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <link rel="shortcut icon" href="/logo-icon.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#2e9f68" />
    <meta name="msapplication-TileColor" content="#2e9f68" />

    <!-- ═══════════════════════════════════════════
         PRIMARY SEO
    ═══════════════════════════════════════════ -->
    <title>InsuranceShiva – Best Insurance Advice in Kadapa & Across India</title>
    <meta name="description" content="Based in Kadapa, InsuranceShiva connects you with India's top certified insurance advisors. Get unbiased, zero-commission advice on life, health, and vehicle insurance." />
    <meta name="keywords" content="insuranceshiva, insuranceshiva kadapa, shiva insurance, insurance advisor kadapa, best insurance kadapa, life insurance kadapa, health insurance kadapa, vehicle insurance kadapa, unbiased insurance advice india, best insurance plans" />
    <meta name="author" content="InsuranceShiva Kadapa" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="google-site-verification" content="G08gp50rtycz_bMuSkhLh8d_B7zgxE7pvB6e3_B9kh0" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.insuranceshiva.com/" />

    <!-- Language & Geo -->
    <meta http-equiv="content-language" content="en-IN" />
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />

    <!-- ═══════════════════════════════════════════
         OPEN GRAPH  (Facebook / LinkedIn / WhatsApp)
    ═══════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InsuranceShiva" />
    <meta property="og:url" content="https://www.insuranceshiva.com/" />
    <meta property="og:title" content="InsuranceShiva – Unbiased Insurance Advice in India" />
    <meta property="og:description" content="Talk to India's top 5% certified advisors. Zero commission, zero spam. Get personalized life, health and vehicle insurance plans starting from ₹361/month." />
    <meta property="og:image" content="https://www.insuranceshiva.com/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="InsuranceShiva – Unbiased Insurance Advice" />
    <meta property="og:locale" content="en_IN" />

    <!-- ═══════════════════════════════════════════
         TWITTER / X CARD
    ═══════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@InsuranceShiva" />
    <meta name="twitter:creator" content="@InsuranceShiva" />
    <meta name="twitter:url" content="https://www.insuranceshiva.com/" />
    <meta name="twitter:title" content="InsuranceShiva – Unbiased Insurance Advice in India" />
    <meta name="twitter:description" content="Zero-commission insurance advice from India's top 5% certified advisors. Life, health & vehicle plans compared for free." />
    <meta name="twitter:image" content="https://www.insuranceshiva.com/logo.png" />
    <meta name="twitter:image:alt" content="InsuranceShiva Logo" />

    <!-- ═══════════════════════════════════════════
         STRUCTURED DATA – Organization
    ═══════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "InsuranceShiva",
      "url": "https://www.insuranceshiva.com",
      "logo": "https://www.insuranceshiva.com/logo.png",
      "description": "InsuranceShiva provides unbiased, zero-commission insurance advice from India's top 5% certified advisors covering life, health, and vehicle insurance.",
      "foundingDate": "2024",
      "areaServed": "IN",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["English", "Hindi", "Telugu"]
      },
      "sameAs": [
        "https://www.instagram.com/insuranceshiva",
        "https://www.facebook.com/insuranceshiva",
        "https://www.youtube.com/@insuranceshiva"
      ]
    }
    </script>

    <!-- ═══════════════════════════════════════════
         STRUCTURED DATA – WebSite (enables Sitelinks Searchbox)
    ═══════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "InsuranceShiva",
      "url": "https://www.insuranceshiva.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.insuranceshiva.com/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ═══════════════════════════════════════════
         STRUCTURED DATA – Insurance Service (FAQPage / Service)
    ═══════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FinancialService",
      "name": "InsuranceShiva",
      "url": "https://www.insuranceshiva.com",
      "image": "https://www.insuranceshiva.com/logo.png",
      "description": "Unbiased insurance advisory service for life, health, and vehicle insurance in India.",
      "priceRange": "₹361/month onwards",
      "areaServed": {
        "@type": "Country",
        "name": "India"
      },
      "serviceType": ["Life Insurance", "Health Insurance", "Vehicle Insurance", "Term Insurance"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Insurance Plans",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Life Insurance Advisory"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Health Insurance Advisory"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Vehicle Insurance Advisory"
            }
          }
        ]
      }
    }
    </script>

    <!-- ═══════════════════════════════════════════
         STRUCTURED DATA – LocalBusiness (Kadapa)
    ═══════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "InsuranceAgency",
      "name": "InsuranceShiva Kadapa",
      "image": "https://www.insuranceshiva.com/logo.png",
      "@id": "https://www.insuranceshiva.com",
      "url": "https://www.insuranceshiva.com",
      "description": "Top-rated insurance advisory firm in Kadapa providing unbiased life, health, and vehicle insurance services.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Kadapa",
        "addressRegion": "Andhra Pradesh",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 14.4673,
        "longitude": 78.8242
      }
    }
    </script>

    <!-- ═══════════════════════════════════════════
         PERFORMANCE HINTS
    ═══════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="dns-prefetch" href="https://api.postalpincode.in" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
